# 로컬 소스에서 직접 빌드하는 기능 2 실행용 compose 파일.
# 기능 2 코드와 RAG 인덱스는 이미지에 포함한다.
# 정형 데이터와 대화 이력만 기능 1과 공유할 SQLite 파일을 사용한다.
#
# 실행:
#   docker compose -f docker-compose.roadmap.yml up -d --build
# 종료:
#   docker compose -f docker-compose.roadmap.yml down
# SHARED_DB_HOST_DIR 아래 seedup.sqlite 파일은 컨테이너 삭제 후에도 유지된다.

services:
  backend:
    # 루트 Dockerfile: Roadmap-Agent 라이브러리 + backend/app (FastAPI, uvicorn :8001)
    build:
      context: .
      dockerfile: Dockerfile
    image: roadmap-api:v5
    container_name: roadmap-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 정형 참조 데이터는 성필님이 새로 적재한 최종 데이터 파일을 직접 가리킨다
      # (기존 seedup.sqlite는 대화 체크포인트와 섞여 있던 예전 파일이라 건드리지 않고 그대로 둔다).
      SHARED_DB_PATH: /app/data/shared/seedup_data.sqlite
      # 대화 체크포인트(LangGraph)는 참조 데이터와 분리된 별도 파일에 저장한다.
      # 참조 데이터를 갱신할 때마다 대화 이력까지 지워야 하는 문제를 없애기 위함.
      CONVERSATION_STORE_PATH: /app/data/shared/conversations.sqlite
      RAG_INDEX_DIR: /app/data/rag_index
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ${SHARED_DB_HOST_DIR:-./data/shared}:/app/data/shared
