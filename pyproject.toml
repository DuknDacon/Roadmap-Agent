[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seedup-roadmap-agent"
version = "0.1.0"
description = "SeedUp 기능 2: 사회초년생 시드머니 로드맵 에이전트"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-genai>=1.0,<2",
  "langgraph>=0.4,<2",
  "llama-index-core>=0.12,<1",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]
ui = ["streamlit>=1.40,<2"]

[project.scripts]
roadmap-agent = "roadmap_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
